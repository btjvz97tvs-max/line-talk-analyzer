<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トーク分析">
<meta name="claude:viewport-fit-sides" content="cover">
<title>トーク分析</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // フォントの読み込みで最初の表示を待たせない（読み込めたら自動で切り替わる）
  (function () {
    var l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap";
    document.head.appendChild(l);
  })();
</script>
<style>
  :root {
    --bg: radial-gradient(circle at 18% -8%, rgba(79,140,255,0.18), transparent 55%), radial-gradient(circle at 100% 105%, rgba(255,166,61,0.16), transparent 55%), #0E0E14;
    --panel: #1D1A26;
    --panel2: #19151F;
    --stroke: #2C2736;
    --text: #F5F3FA;
    --sub: #9A93AC;
    --font: "Hachi Maru Pop", "Hiragino Maru Gothic Pro", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--font);
    display: flex;
    justify-content: center;
  }
  .no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
  .no-scrollbar::-webkit-scrollbar{display:none}
  #root { width: 100%; max-width: 440px; padding-bottom: 24px; }
  :root { --lta-max: 440px; }
  .lta-page { display: block; }
  /* 画面全体で文字の選択・コピーをできなくする（読み込み中の画面やシェアのプレビューも含む）。
     入力欄だけは今までどおり入力・選択できる。写真の長押し保存は img 側の指定で別途許可する */
  *, *::before, *::after { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
</style>

<div id="root">
  <div id="lta-loading" style="color:#9A93AC;font-family:sans-serif;font-size:13px;text-align:center;padding:40px 16px;">読み込み中…</div>
</div>

<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.dataset.ltaMounted) {
      root.innerHTML =
        '<div style="color:#FF5C7A;font-family:sans-serif;font-size:13px;text-align:center;padding:40px 16px;line-height:1.6;">' +
        "読み込みに失敗しました。再読み込みしてください。<br><br><span style=\"opacity:0.7;font-size:11px;\">" +
        (e.message || "unknown error") +
        "</span></div>";
    }
  });
  // 右クリック／長押しのメニューも出さない（写真の保存用の img だけは例外にする）
  document.addEventListener("contextmenu", function (e) {
    if (e.target && e.target.tagName === "IMG") return;
    e.preventDefault();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
<script>
  // グラフ部品(Recharts)は大きいので、画面を出すのを待たせずに後から読み込む（先読み済みなのでほぼすぐ使える）
  window.__rechartsPromise = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/recharts@2.10.3/umd/Recharts.js";
    s.crossOrigin = "anonymous";
    s.async = true;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error("recharts")); };
    document.head.appendChild(s);
  });
  window.__rechartsPromise.catch(function () {});
</script>
